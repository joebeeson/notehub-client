[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notehub-client"
version = "0.1.0"
description = "Async Python client for the Blues Notehub REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Joe Beeson" }]
keywords = ["blues", "notehub", "iot", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "cattrs>=24.1,<27", "typing-extensions>=4.6"]

[project.optional-dependencies]
yaml = ["pyyaml>=6,<7"]
fsspec = ["fsspec>=2024.2"]
validate = ["jsonschema>=4.22,<5"]
oauth = ["authlib>=1.6.11,<1.7"]
cli = ["click>=8.1,<9", "rich>=13,<15"]
tui = ["notehub-client[cli]", "textual>=8,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
web = ["notehub-client[api,cli]"]
mcp = ["fastmcp>=4,<5"]

[dependency-groups]
dev = ["prek>=0.5.10,<0.6"]
lint = ["ruff>=0.9,<1"]
security = [
    "bandit[toml]>=1.9,<2",
    "vulture>=2.16,<3",
]
test = [
  "notehub-client[cli,oauth,tui,api,web,mcp,yaml,fsspec,validate]",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6,<8",
  "pytest-datadir>=1.8,<2",
  "pytest-textual-snapshot>=1,<2",
  "respx>=0.21",
]
type = [
  "notehub-client[tui,api,mcp]",
  "pyrefly>=1.4,<2",
  "types-Authlib",
  "types-PyYAML",
  "types-jsonschema",
  { include-group = "test" },
]

[project.scripts]
notehub = "notehub_client.__main__:cli_main"
notehub-client = "notehub_client.__main__:main"
notehub-client-tui = "notehub_client.__main__:tui_main"
notehub-client-api = "notehub_client.__main__:api_main"
notehub-client-web = "notehub_client.__main__:web_main"
notehub-client-mcp = "notehub_client.__main__:mcp_main"

[tool.hatch.build.hooks.custom]
path = "build_frontend.py"

[project.urls]
Homepage = "https://github.com/joebeeson/notehub-client"
Repository = "https://github.com/joebeeson/notehub-client"
Issues = "https://github.com/joebeeson/notehub-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/notehub_client"]
artifacts = ["src/notehub_client/runtimes/web/static/**"]

[tool.pytest.ini_options]
addopts = [
  "--doctest-modules",
  "--cov=notehub_client",
  "--cov-report=term-missing",
  "-m",
  "not e2e",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_markers = true
markers = ["e2e: opt-in tests that make requests to the remote Notehub API"]
testpaths = ["tests", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF022", "S"]
extend-select = ["D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "S101"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.vulture]
min_confidence = 100

[tool.pyrefly]
project-includes = [
  "src/**/*.py",
  "tests/**/*.py",
]
