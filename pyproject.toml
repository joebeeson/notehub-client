[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notehub-client"
version = "0.1.0"
description = "Async Python client for the Blues Notehub REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Joe Beeson" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
oauth = ["authlib>=1.3,<2"]
cli = ["click>=8.1,<9", "rich>=13,<15"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]

[project.scripts]
notehub = "notehub_client.cli:main"

[project.urls]
Homepage = "https://github.com/joebeeson/notehub-client"
Repository = "https://github.com/joebeeson/notehub-client"
Issues = "https://github.com/joebeeson/notehub-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/notehub_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
